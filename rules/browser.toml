id = "edge-webview2"
match = { windows = ["msedgewebview2"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "medium"
description = "WebView2: lo usan otras apps además de Edge."
description_en = "WebView2: other apps besides Edge use it."
