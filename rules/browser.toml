# Indexadores de archivos del escritorio en Linux (el equivalente de Windows Search, que en
# Windows es el servicio WSearch). Son unidades de usuario de systemd, que el helper no gestiona,
# así que se congelan como procesos. Debian: tracker-miner-fs (bookworm), localsearch (sid),
# baloo6 (trixie) y baloo-kf5 (bookworm).
[[rule]]
id = "desktop-indexer"
match = { linux = ["tracker-miner-fs-3", "localsearch-3", "localsearch-extractor-3", "baloo_file", "baloo_file_extractor"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "low"
description = "Indexador de archivos del escritorio (Tracker, LocalSearch o Baloo): CPU y disco en segundo plano."
description_en = "Desktop file indexer (Tracker, LocalSearch or Baloo): background CPU and disk."

# GNOME Software: busca actualizaciones en segundo plano (arranca con la sesión por
# /etc/xdg/autostart/org.gnome.Software.desktop; Debian gnome-software, trixie). Solo Extremo,
# como Windows Update.
[[rule]]
id = "gnome-software"
match = { linux = ["gnome-software"] }
category = "updater"
action = "suspend"
min_level = "extremo"
risk = "low"
description = "GNOME Software: comprobación de actualizaciones en segundo plano."
description_en = "GNOME Software: background update checks."
