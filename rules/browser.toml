# Reglas de FrameRush (navegadores y apps). Esquema en PLAN.md §3, "Modelo de reglas".
# Fuente de los nombres de Windows: proyecto de referencia CS2-FPS-Boost ($SuspendNames).
# Nombres de Linux: listas de archivos de los paquetes de Debian (packages.debian.org) y el
# instalador de Chromium (PLAN.md §6, V20 Linux; docs/investigacion/inv-linux-macos.md §3).
# Faltan los de macOS hasta verificarlos.

# Navegadores: opcionales en Agresivo (desmarcados), PLAN.md §3.

[[rule]]
id = "chrome"
# Linux: `PROGNAME=chrome` en chrome/installer/linux/common/chromium-browser.info.
match = { windows = ["chrome"], linux = ["chrome"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "low"
description = "Google Chrome."
description_en = "Google Chrome."
optional = true

[[rule]]
id = "edge"
match = { windows = ["msedge"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "low"
description = "Microsoft Edge."
description_en = "Microsoft Edge."
optional = true

