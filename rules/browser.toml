# Reglas de FrameRush (navegadores y apps). Esquema en PLAN.md §3, "Modelo de reglas".
# Fuente de los nombres de Windows: proyecto de referencia CS2-FPS-Boost ($SuspendNames).
# Los nombres de Linux y macOS faltan hasta verificarlos (PLAN.md §6, V20).

# Navegadores: opcionales en Agresivo (desmarcados), PLAN.md §3.

[[rule]]
id = "chrome"
match = { windows = ["chrome"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "low"
description = "Google Chrome."
optional = true

[[rule]]
id = "edge"
match = { windows = ["msedge"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "low"
description = "Microsoft Edge."
optional = true

[[rule]]
id = "edge-webview2"
match = { windows = ["msedgewebview2"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "medium"
description = "WebView2: lo usan otras apps además de Edge."
optional = true

[[rule]]
id = "firefox"
match = { windows = ["firefox"] }
category = "browser"
action = "suspend"
min_level = "agresivo"
risk = "low"
description = "Mozilla Firefox."
optional = true

