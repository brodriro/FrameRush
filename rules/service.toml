# WdiServiceHost y WdiSystemHost (en la referencia) no están: su descriptor da SERVICE_STOP a
# los administradores pero SERVICE_START solo a SYSTEM y a DPS (`sc sdshow`, Windows 11), así
# que detenerlos no se podría deshacer. DPS los arranca cuando los necesita.

