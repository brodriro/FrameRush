# Reglas de FrameRush (servicios grupo A y B). Esquema en PLAN.md §3, "Modelo de reglas".
# Fuente de los nombres de Windows: proyecto de referencia CS2-FPS-Boost ($SvcAggressive y $SvcExtremeExtra).
# Los nombres de Linux y macOS faltan hasta verificarlos (PLAN.md §6, V20).

# Grupo A: desde Agresivo. Se detienen solo durante la sesión, sin cambiar el tipo de inicio.

[[rule]]
id = "sysmain"
match = { windows = ["SysMain"] }
category = "service"
action = "stop_service"
min_level = "agresivo"
risk = "low"
description = "Prefetch/Superfetch: E/S de disco en segundo plano."
description_en = "Prefetch/Superfetch: background disk I/O."

[[rule]]
id = "wsearch"
match = { windows = ["WSearch"] }
category = "service"
action = "stop_service"
min_level = "agresivo"
risk = "low"
description = "Indexador de Windows Search: el mayor consumidor de CPU y disco en segundo plano según la referencia."
description_en = "Windows Search indexer: the biggest background CPU and disk user according to the reference."

[[rule]]
id = "diagtrack"
match = { windows = ["DiagTrack"] }
category = "service"
action = "stop_service"
min_level = "agresivo"
risk = "low"
description = "Telemetría de Windows (Experiencias del usuario y telemetría asociadas)."
description_en = "Windows telemetry (Connected User Experiences and Telemetry)."

[[rule]]
