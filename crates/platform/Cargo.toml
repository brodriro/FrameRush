[package]
name = "framerush-platform"
description = "Traits de acceso al SO de FrameRush y sus implementaciones por plataforma."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
# Protocolo del helper elevado.
serde_json.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_SecurityCenter",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }
windows-sys = { workspace = true, features = [
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# MockPlatform en memoria para los tests de otros crates.
mock = []

[lints]
workspace = true
