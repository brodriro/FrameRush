[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/gui/src-tauri", "apps/helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
framerush-core = { path = "crates/core" }
framerush-device = { path = "crates/device" }
framerush-platform = { path = "crates/platform" }
framerush-rules = { path = "crates/rules" }
framerush-sensors = { path = "crates/sensors" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror = "2"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
windows-sys = "0.61"
# Solo para las interfaces COM que windows-sys no trae (DXGI); ya lo usa sysinfo.
windows = "0.61"
# NVML (GPU NVIDIA): carga nvml.dll / libnvidia-ml.so del driver en tiempo de ejecución.
nvml-wrapper = "0.13"
# GUI (Tauri 2 estable; la 3 aún es alpha).
tauri = "2.12"
tauri-build = "2.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
