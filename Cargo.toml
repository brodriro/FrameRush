[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/gui/src-tauri", "apps/helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
framerush-core = { path = "crates/core" }
framerush-device = { path = "crates/device" }
framerush-platform = { path = "crates/platform" }
framerush-rules = { path = "crates/rules" }
framerush-sensors = { path = "crates/sensors" }
framerush-games = { path = "crates/games" }
framerush-steam = { path = "crates/steam" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
thiserror = "2"
toml = "0.9"
# VDF de Steam (libraryfolders.vdf, appmanifest_*.acf).
keyvalues-parser = "0.2.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
ctrlc = "3.5"
windows-sys = "0.61"
# Llamadas al SO en Linux y macOS (setpriority, señales, sched_setaffinity, pidfd, sysctl); ya
# lo usa sysinfo.
libc = "0.2"
# Solo para las interfaces COM que windows-sys no trae (DXGI); ya lo usa sysinfo.
windows = "0.61"
# NVML (GPU NVIDIA): carga nvml.dll / libnvidia-ml.so del driver en tiempo de ejecución.
nvml-wrapper = "0.13"
# GUI (Tauri 2 estable; la 3 aún es alpha).
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
# Notificaciones del sistema para las alertas térmicas (It3.6), plugin oficial.
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
